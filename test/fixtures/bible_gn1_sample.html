<!DOCTYPE html><html><body>
<h1>창세기 1장</h1>
<div id="bibleContents">
  <div class="row">
    <div class="col-1"><span class="highlight">1</span></div>
    <div class="col-11">한처음에 하느님께서 하늘과 땅을 창조하셨다.</div>
  </div>
  <div class="row">
    <div class="col-1"><span class="highlight">2</span></div>
    <div class="col-11">땅은 아직 꼴을 갖추지 못하고 비어 있었는데, 어둠이 심연을 덮고 하느님의 영이 그 물 위를 감돌고 있었다.</div>
  </div>
  <div class="row">
    <div class="col-1"><span class="highlight">3</span></div>
    <div class="col-11">하느님께서 말씀하시기를 &quot;빛이 생겨라.&quot; 하시자 빛이 생겼다.</div>
  </div>
</div>
</body></html>
