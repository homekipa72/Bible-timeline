<!DOCTYPE html><html><body>
<h1>요한 복음서 3장</h1>
<div id="bibleContents">
  <div class="d-flex row">
    <div class="col-1 text-center"><span class="highlight">16</span></div>
    <div class="col-11 verse-text">하느님께서는 세상을 너무나 사랑하신 나머지 외아들을 내 주시어, 그를 믿는 사람은 누구나 멸망하지 않고 영원한 생명을 얻게 하셨다.</div>
  </div>
  <div class="d-flex row">
    <div class="col-1 text-center"><span class="highlight">17</span></div>
    <div class="col-11 verse-text">하느님께서 아들을 세상에 보내신 것은, 세상을 심판하시려는 것이 아니라 아들을 통하여 세상이 구원을 받게 하시려는 것이다.</div>
  </div>
</div>
</body></html>
